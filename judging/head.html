<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة رئيس الحكام</title>
<link rel="stylesheet" href="judge.css?v=2">
<link rel="stylesheet" href="head.css?v=1">
</head>
<body>
<header class="bar">
  <strong class="brand" data-i="brand">لوحة رئيس الحكام</strong>
  <span class="spacer"></span>
  <button class="icon" id="lang" type="button" title="English / عربي">EN</button>
  <button class="icon" id="theme" type="button" aria-label="الوضع الليلي / النهاري">🌙</button>
  <button class="icon" id="logout" type="button" hidden data-i="logout">خروج</button>
</header>

<section id="login" class="card narrow" style="margin-top:8vh">
  <h1 data-i="loginTitle">دخول رئيس الحكام</h1>
  <label><span data-i="email">الإيميل</span><input id="em" type="email" autocomplete="username" dir="ltr"></label>
  <label><span data-i="password">كلمة السر</span><input id="pw" type="password" autocomplete="current-password" dir="ltr"></label>
  <button class="primary" id="go" type="button" data-i="enter">دخول</button>
  <p id="loginMsg" class="msg" role="alert"></p>
</section>

<div id="app" hidden>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="pane"></main>
</div>

<div id="tipBox" class="tipbox" role="tooltip" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script src="head.js?v=3"></script>
</body>
</html>
