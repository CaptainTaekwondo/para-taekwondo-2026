<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أصدر شهادتك | بطولة أساسيات البارا تايكوندو 2026</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="certificate.css?v=1">
</head>
<body>
<header class="top">
  <img src="../assets/champion.webp" alt="" width="40" height="40">
  <b data-i="brand">بطولة أساسيات البارا تايكوندو 2026</b>
  <span class="sp"></span>
  <a class="ib" href="../index.html" data-i="home" style="display:inline-flex;align-items:center;text-decoration:none">الموقع</a>
  <button class="ib" id="lang" type="button" title="English / عربي">EN</button>
</header>
<main>
  <section class="hero">
    <h1 data-i="title">أصدر شهادتك</h1>
    <p data-i="sub">أدخل بياناتك كما سُجّلت في البطولة لعرض شهادتك وتحميلها.</p>
  </section>

  <section class="card noprint" id="formCard">
    <div class="seg" role="group" aria-label="نوع الدخول" id="roles">
      <button type="button" data-role="player" aria-pressed="true" data-i="r_player">لاعب</button>
      <button type="button" data-role="coach" aria-pressed="false" data-i="r_coach">مدرب</button>
      <button type="button" data-role="judge" aria-pressed="false" data-i="r_judge">حكم</button>
    </div>
    <label id="fCode"><span id="lCode" data-i="l_code_player">كود اللاعب (مثال: PTP-2026-0001)</span><input id="code" type="text" dir="ltr" autocomplete="off" autocapitalize="characters"></label>
    <div class="grid2">
      <label id="fPhone"><span data-i="l_phone">رقم الموبايل</span><input id="phone" type="tel" dir="ltr" autocomplete="tel"></label>
      <label><span data-i="l_email">الإيميل</span><input id="email" type="email" dir="ltr" autocomplete="email"></label>
    </div>
    <label id="fPass" hidden><span data-i="l_pass">كلمة السر</span><input id="pass" type="password" dir="ltr" autocomplete="current-password"></label>
    <div class="row"><button class="btn fill" id="go" type="button" data-i="show">عرض شهادتي</button></div>
    <p class="msg" id="msg" role="alert"></p>
    <p class="note" data-i="privacy">تُستخدم هذه البيانات للتحقق من هويتك فقط، ولا تظهر على الشهادة.</p>
  </section>

  <section class="card noprint" id="infoCard" hidden></section>

  <section id="certArea" hidden>
    <div class="card noprint" id="certHead"></div>
    <div class="stage print" id="stage"><canvas id="cv" aria-label="الشهادة"></canvas></div>
    <div class="row noprint" id="certBtns">
      <button class="btn fill" id="dl" type="button" data-i="download">تحميل الشهادة (JPG)</button>
      <button class="btn" id="pr" type="button" data-i="print">طباعة / حفظ PDF</button>
      <button class="btn" id="corr" type="button" data-i="corr">طلب تعديل</button>
    </div>
    <div class="card noprint" id="corrBox" hidden>
      <h2 data-i="corrT">طلب تعديل بيانات الشهادة</h2>
      <label><span data-i="corrL">اكتب التعديل المطلوب (مثال: تصحيح كتابة الاسم)</span><textarea id="corrText" rows="3" maxlength="1000"></textarea></label>
      <div class="row"><button class="btn fill" id="corrSend" type="button" data-i="send">إرسال الطلب</button></div>
      <p class="msg" id="corrMsg" role="status"></p>
      <p class="note" data-i="corrNote">يراجع صاحب الموقع الطلب، وعند الموافقة تُصدَر شهادة جديدة برقم جديد وتُلغى القديمة.</p>
    </div>
  </section>
</main>
<div class="toast" id="toast" hidden role="status"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="config.js"></script>
<script src="cert-render.js?v=1"></script>
<script src="certificate.js?v=2"></script>
</body>
</html>
