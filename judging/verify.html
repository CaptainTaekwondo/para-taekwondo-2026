<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>التحقق من الشهادة | بطولة أساسيات البارا تايكوندو 2026</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="certificate.css?v=1">
</head>
<body>
<header class="top">
  <img src="../assets/champion.webp" alt="" width="40" height="40">
  <b id="brand">بطولة أساسيات البارا تايكوندو 2026</b>
  <span class="sp"></span>
  <button class="ib" id="lang" type="button" title="English / عربي">EN</button>
</header>
<main>
  <section class="hero"><h1 id="h1">التحقق من الشهادة</h1><p id="sub">أدخل رقم الشهادة أو امسح رمز QR الموجود عليها.</p></section>
  <section class="card">
    <label><span id="lbl">رقم الشهادة</span><input id="serial" type="text" dir="ltr" placeholder="PTC-2026-XXXXXX" autocapitalize="characters" autocomplete="off"></label>
    <div class="row"><button class="btn fill" id="go" type="button">تحقق</button></div>
  </section>
  <section class="card" id="res" hidden aria-live="polite"></section>
  <p class="note" id="foot">تعرض هذه الصفحة البيانات المسجّلة وقت إصدار الشهادة. قارن الاسم والمركز مع الشهادة التي بين يديك.</p>
</main>
<script src="config.js"></script>
<script>
(function () {
  var $ = function (i) { return document.getElementById(i); }, API = (window.JUDGING && window.JUDGING.api) || '';
  var T = { ar: { brand: 'بطولة أساسيات البارا تايكوندو 2026', h1: 'التحقق من الشهادة', sub: 'أدخل رقم الشهادة أو امسح رمز QR الموجود عليها.', lbl: 'رقم الشهادة', go: 'تحقق',
      foot: 'تعرض هذه الصفحة البيانات المسجّلة وقت إصدار الشهادة. قارن الاسم والمركز مع الشهادة التي بين يديك.', ok: 'شهادة صحيحة ومسجّلة', replaced: 'شهادة ملغاة (استُبدلت بشهادة جديدة)', nf: 'لا توجد شهادة بهذا الرقم', neterr: 'تعذّر الاتصال، حاول مرة أخرى.',
      name: 'الاسم', type: 'النوع', section: 'القسم', group: 'الفئة', cls: 'التصنيف', place: 'المركز', band: 'المستوى', score: 'الدرجة', tour: 'البطولة', date: 'تاريخ الإصدار', newer: 'الرقم الجديد',
      rank: 'شهادة تقدير (مركز)', participation: 'شهادة مشاركة', coach: 'شهادة تقدير مدرب', judge: 'شهادة تقدير حكم' },
    en: { brand: 'Arab Para Taekwondo Basics Championship 2026', h1: 'Verify a certificate', sub: 'Enter the certificate number or scan the QR code printed on it.', lbl: 'Certificate number', go: 'Verify',
      foot: 'This page shows the data recorded when the certificate was issued. Compare the name and place with the certificate you hold.', ok: 'Valid, registered certificate', replaced: 'Cancelled certificate (replaced by a new one)', nf: 'No certificate with this number', neterr: 'Connection failed, try again.',
      name: 'Name', type: 'Type', section: 'Section', group: 'Group', cls: 'Class', place: 'Place', band: 'Level', score: 'Score', tour: 'Championship', date: 'Issue date', newer: 'New number',
      rank: 'Achievement certificate', participation: 'Participation certificate', coach: 'Coach appreciation', judge: 'Judge appreciation' } };
  var lang = 'ar'; try { lang = localStorage.getItem('jd_lang') || 'ar'; } catch (e) {}
  function t(k) { return (T[lang] && T[lang][k]) || T.ar[k] || k; }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt !== undefined) e.textContent = txt; return e; }
  function static_() {
    document.documentElement.lang = lang; document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr'; $('lang').textContent = lang === 'ar' ? 'EN' : 'ع';
    ['brand', 'h1', 'sub', 'lbl', 'foot'].forEach(function (i) { $(i).textContent = t(i); }); $('go').textContent = t('go');
  }
  function fmt(iso) { try { return new Date(iso).toLocaleDateString(lang === 'ar' ? 'ar-EG-u-nu-latn' : 'en-GB', { year: 'numeric', month: 'long', day: 'numeric' }); } catch (e) { return String(iso).slice(0, 10); } }
  var last = null;
  function render(r) {
    var box = $('res'); box.hidden = false; box.innerHTML = ''; last = r;
    if (r === 'net') { box.appendChild(el('span', 'tag bad', t('neterr'))); return; }
    if (!r.found) { box.appendChild(el('span', 'tag bad', t('nf'))); return; }
    var c = r.cert, active = c.status === 'active';
    box.appendChild(el('span', 'tag ' + (active ? 'ok' : 'warn'), active ? '✓ ' + t('ok') : '⚠ ' + t('replaced')));
    var info = el('div', 'info'); box.appendChild(info);
    function pill(l, v, ser) { if (v === '' || v === null || v === undefined) return; var p = el('div', 'pill'); p.appendChild(el('small', '', l)); p.appendChild(ser ? el('span', 'serial', v) : document.createTextNode(String(v))); info.appendChild(p); }
    pill(t('name'), c.name); pill(t('type'), t(c.type)); pill(t('section'), c.section); pill(t('group'), c.groupName); pill(t('cls'), c.classCode); pill(t('place'), c.place); pill(t('band'), c.band);
    if (c.total !== null && c.total !== undefined) pill(t('score'), Number(c.total).toFixed(2));
    pill(t('tour'), c.tournament); pill(t('date'), fmt(c.issued)); pill('No.', c.serial, true);
    if (c.replacedBy) { pill(t('newer'), c.replacedBy, true); var a = el('a', 'btn sm', c.replacedBy); a.href = '?s=' + encodeURIComponent(c.replacedBy); box.appendChild(a); }
  }
  function check() {
    var s = $('serial').value.trim().toUpperCase(); if (!s) return; $('go').disabled = true;
    fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: 'certVerify', serial: s }) })
      .then(function (r) { return r.json(); }).catch(function () { return null; })
      .then(function (r) { $('go').disabled = false; render(r && r.ok ? r : (r ? { found: false } : 'net')); });
  }
  $('go').onclick = check; $('serial').addEventListener('keydown', function (e) { if (e.key === 'Enter') check(); });
  $('lang').onclick = function () { lang = lang === 'ar' ? 'en' : 'ar'; try { localStorage.setItem('jd_lang', lang); } catch (e) {} static_(); if (last) render(last); };
  static_();
  var q = new URLSearchParams(location.search).get('s'); if (q && API) { $('serial').value = q; check(); }
})();
</script>
</body>
</html>
